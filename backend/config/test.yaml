# Loco.rs test environment configuration for HireTrack

logger:
  enable: false
  pretty_backtrace: true
  level: warn
  format: compact

server:
  port: 5151
  binding: localhost
  host: http://localhost
  ident: hiretrack-backend-test

workers:
  mode: ForegroundBlocking

auth:
  jwt:
    secret: <%= get_env(name="JWT_SECRET", default="hiretrack_test_jwt_secret") %>
    expiration: 3600

database:
  uri: <%= get_env(name="TEST_DATABASE_URL", default="postgres://postgres:postgres@localhost:5432/hiretrack_test") %>
  enable_logging: false
  min_connections: 1
  max_connections: 2
  connect_timeout: 5000
  idle_timeout: 5000
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: true
