[workspace]

[package]
name = "hiretrack_backend"
version = "0.1.0"
edition = "2021"
description = "Loco.rs backend API for the HireTrack Recruitment Management System"
default-run = "hiretrack_backend-cli"

[workspace.dependencies]
loco-rs = { version = "1.3" }

[dependencies]
loco-rs = { workspace = true }
dotenvy = "0.15"
migration = { path = "migration" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.22"
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
sea-orm = { version = "2.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }

[[bin]]
name = "hiretrack_backend-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
